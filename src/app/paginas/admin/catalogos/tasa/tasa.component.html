<p-toolbar styleClass="p-mb-4">
    <ng-template pTemplate="left">
      <button
        pButton
        pRipple
        label="Nuevo"
        icon="pi pi-plus"
        class="p-button-accion p-mr-2"
        (click)="openNew()"
      ></button>
      <button
        pButton
        pRipple
        label="Borrar"
        icon="pi pi-trash"
        class="p-button-danger p-mr-2"
        (click)="deleteSelectedItems()"
        [disabled]="!selectedRegistros || !selectedRegistros.length"
      ></button>
      <button
              pButton
              pRipple
              label="Exportar"
              icon="pi pi-file-excel"
              class="p-button-success p-mr-2"
              (click)="exportExcel()"
             [disabled]="!datos.length">
          
              </button>
    </ng-template>
  </p-toolbar>
  <p-table
  #dt
  [columns]="cols"
  [value]="datos"
  [rows]="10"
  [paginator]="true"
  [(selection)]="selectedRegistros"
  [globalFilterFields]="['nombre','mes']"
  [rowHover]="true"
  dataKey="tasa_id"
  editMode="row"
  scrollHeight="500px"
  selectionMode="single"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} entradas"
  [showCurrentPageReport]="true"
>
  <ng-template pTemplate="caption">
    <div class="p-d-flex p-ai-center p-jc-between p-mb-2">
      <h5 class="p-m-1">Tasas</h5>
    </div>

    <div class="p-grid">
 
      <div class="p-col p-text-right">
        <span class="p-input-icon-left">
          <i class="pi pi-search"></i>
          <input
            pInputText
            type="text"
            (input)="dt.filterGlobal($event.target.value, 'contains')"
            placeholder="Buscar..."
          />
        </span>
      </div>
    </div>
  </ng-template>

  <ng-template pTemplate="header" let-columns>
    <tr>
      <th style="width: 3rem" [ngStyle]="{ width: '5%' }" class="text-center">
        <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
      </th>
      <th
        class="text-center"
        *ngFor="let col of columns"
        pResizableColumn
        [pSortableColumn]="col.field"
        [ngStyle]="{ width: col.width }"
      >
        {{ col.header }}
      </th>
      <th [ngStyle]="{ width: '20%' }" class="text-center">Acciones</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-rowData let-columns="columns">
    <tr>
      <td style="width: 3em" [ngStyle]="{ width: '5%' }" class="text-center">
        <a href="#" [pRowToggler]="rowData">
          <p-tableCheckbox [value]="rowData"></p-tableCheckbox>
        </a>
      </td>
      <td *ngFor="let col of columns" class="text-center">
        {{ rowData[col.field] }}
      </td>
      <td class="text-center">
        <button
          pButton
          pRipple
          icon="pi pi-pencil"
          class="p-button-rounded p-button-accion p-mr-2"
          (click)="edit(rowData)"
        ></button>
        <button
          pButton
          pRipple
          icon="pi pi-trash"
          class="p-button-rounded p-button"
          (click)="confirmDelete(rowData)"
        ></button>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="summary">
    <div class="p-d-flex p-ai-center p-jc-between">
      En total hay
      {{ datos ? datos.length : 0 }}
      tasas.
    </div>
  </ng-template>
</p-table>

<p-dialog
  [(visible)]="displayDialog"
  [style]="{ width: '450px' }"
  [(header)]="tituloDialogo"
  [modal]="true"
  styleClass="p-fluid"
  [closable]="false"
  [contentStyle]="{ overflow: 'visible' }"
>
  <ng-template pTemplate="content">
    
    <form [formGroup]="form" novalidate>
      <div class="p-fluid p-formgrid p-grid">
        <div class="p-field">
            <label for="nombre">Tasa*</label>
            <input
              type="text"
              formControlName="nombre"
              pInputText
              id="nombre"
              [(ngModel)]="tasa_unic.nombre"
              autofocus
              required
            />
            <small
              class="p-invalid"
              *ngIf="submitted && form.get('nombre').hasError('required')"
              >* Campo requerido</small
            >
          </div>
          <div class="p-field">
            <label for="mes">Mes*</label>
            <input
              type="text"
              formControlName="mes"
              pInputText
              id="mes"
              [(ngModel)]="tasa_unic.mes"
              autofocus
              required
            />
            <small
              class="p-invalid"
              *ngIf="submitted && form.get('mes').hasError('required')"
              >* Campo requerido</small
            >
          </div>
          <div class="p-field">
            <label for="anio">Año*</label>
            <input
              type="text"
              formControlName="anio"
              pInputText
              id="anio"
              [(ngModel)]="tasa_unic.anio"
              autofocus
              required
            />
            <small
              class="p-invalid"
              *ngIf="submitted && form.get('anio').hasError('required')"
              >* Campo requerido</small
            >
          </div>

          <div class="p-field">
            <label for="moneda">Moneda*</label>
            <input
              type="text"
              formControlName="moneda"
              pInputText
              id="moneda"
              [(ngModel)]="tasa_unic.moneda"
              autofocus
              required
            />
            <small
              class="p-invalid"
              *ngIf="submitted && form.get('moneda').hasError('required')"
              >* Campo requerido</small
            >
          </div>
      </div>
    </form>
  </ng-template>

  <ng-template pTemplate="footer">
    <button
      pButton
      pRipple
      label="Cancelar"
      icon="pi pi-times"
      class="p-button-text"
      (click)="close()"
    ></button>
    <button
      pButton
      pRipple
      label="Guardar"
      icon="pi pi-check"
      class="p-button-text"
      (click)="save()"
    ></button>
  </ng-template>
</p-dialog>

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>
