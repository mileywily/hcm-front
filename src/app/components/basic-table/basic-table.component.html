
<p-table #dt [autoLayout]="autoLayout" [columns]="cols" [value]="registros" [resizableColumns]="resizable" [rows]="10" [paginator]="true"
    selectionMode="single" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} entradas"
    [showCurrentPageReport]="true"  [loading]="loading">
    <ng-template pTemplate="caption">
        <div class="p-d-flex p-ai-center p-jc-between" *ngIf="registros.length > 0">
            <div class="p-d-flex">
                <button *ngIf="exportarExcel" type="button" pButton pRipple icon="pi pi-file-excel" (click)="exportExcel()" class="p-button-success p-mr-2"  pTooltip="XLS" tooltipPosition="bottom"></button>
                <button *ngIf="exportarPdf" type="button" pButton pRipple icon="pi pi-file-pdf" (click)="exportPdf()" class="p-button-warning p-mr-2" pTooltip="PDF" tooltipPosition="bottom"></button>
            </div>
            <h5 class="p-m-0"></h5>
            <span class="p-input-icon-left">
                <i class="pi pi-search"></i>
                <input pInputText type="text" (input)="dt.filterGlobal($event.target.value, 'contains')"
                    placeholder="Buscar..." />
            </span>
        </div>
    </ng-template>

    <ng-template pTemplate="header" let-columns>
        <tr>
            <th *ngFor="let col of columns" pResizableColumn [pSortableColumn]="col.field"
                [ngStyle]="{'width': col.width}">
                {{col.header}}
            </th>
            <!-- <th pResizableColumn></th> -->
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-rowData let-columns="columns">
        <tr>
            <td *ngFor="let col of columns" class="text-center">
                {{rowData[col.field]}}
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="9" style="text-align:left">No se han encontrado registros.</td>
        </tr>
    </ng-template>
    <ng-template pTemplate="summary" *ngIf="summary">
        <div class="p-d-flex p-ai-center p-jc-between">
            Total general: {{cantidad}}
        </div>
    </ng-template>
    <ng-template pTemplate="footer" *ngIf="footer">
        <tr *ngIf="totales">
            <td>Total</td>
            <td class="text-center">{{totales.almuerzo}}</td>
            <td class="text-center">{{totales.cena}}</td>
            <td class="text-center">{{totales.nocturna}}</td>
            <td class="text-center">{{totales.sobretiempo}}</td>
            <td class="text-center">{{totales.total}}</td>
        </tr>
    </ng-template>


</p-table>
